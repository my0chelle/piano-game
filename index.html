<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>피아노 초견 마스터</title>
    <!-- VexFlow 라이브러리 (악보 렌더링용) -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <!-- Tone.js 라이브러리 (피아노 오디오 재생용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f7;
            margin: 0;
            padding: 15px;
            touch-action: manipulation;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, select {
            padding: 8px 16px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007aff;
            color: white;
            font-weight: bold;
        }
        select {
            background-color: #fff;
            color: #333;
            border: 2px solid #007aff;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score { color: #34c759; }
        #message {
            height: 24px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff3b30;
        }
        #staff-container {
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            max-width: 100%;
            overflow-x: auto;
        }
        
        /* 피아노 건반 CSS (모바일에 맞게 크기 축소 및 스크롤 허용) */
        .piano {
            display: flex;
            position: relative;
            height: 160px; /* 200px에서 160px로 축소 */
            background: #333;
            padding: 10px 10px 0 10px;
            border-radius: 10px 10px 0 0;
            overflow-x: auto; 
            max-width: 100%; 
            box-sizing: border-box; 
            touch-action: pan-x; /* 가로 스크롤 명시적 허용 */
            -webkit-overflow-scrolling: touch; /* iOS 부드러운 스크롤 */
        }
        .key {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0; 
        }
        .key.white {
            width: 36px; /* 40px에서 36px로 축소 */
            height: 150px; /* 200px에서 150px로 축소 */
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            z-index: 1;
            color: #333;
        }
        .key.white:active, .key.white.active {
            background: #e0e0e0;
        }
        .key.black {
            width: 24px; /* 28px에서 24px로 축소 */
            height: 90px; /* 120px에서 90px로 축소 */
            background: black;
            margin-left: -12px;
            margin-right: -12px;
            z-index: 2;
            border-radius: 0 0 5px 5px;
            color: white;
            font-size: 11px;
            padding-bottom: 10px;
        }
        .key.black:active, .key.black.active {
            background: #333;
        }
        .key.correct {
            background-color: #d4edda !important; 
            border-color: #28a745 !important;
        }
        .key.incorrect {
            background-color: #f8d7da !important; 
            border-color: #dc3545 !important;
        }
        .key.target-note {
            background-color: #add8e6 !important; 
            border-color: #007bff !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎹 피아노 초견 게임</h1>
    </div>

    <div class="controls">
        <select id="hand-select">
            <option value="bass">왼손 (낮음자리표)</option>
            <option value="treble">오른손 (높음자리표)</option>
        </select>
        <select id="level-select">
            <option value="1">단계 1</option>
            <option value="2">단계 2</option>
            <option value="3">단계 3</option>
            <option value="4">단계 4</option>
            <option value="5">단계 5</option>
        </select>
        <button onclick="startGame()">게임 시작 / 초기화</button>
        <button onclick="retryQuestion()">문제 다시 풀기</button>
    </div>

    <div class="stats">
        <div>단계: <span id="level-display">1</span> / 5</div>
        <div>정답 수: <span id="score-display">0</span> / 5</div>
    </div>

    <div id="message"></div>

    <div id="staff-container"></div>
    <div id="piano-container" class="piano"></div>

    <script>
        const piano = new Tone.Sampler({
            urls: {
                "C2": "C2.mp3",
                "C3": "C3.mp3",
                "C4": "C4.mp3",
                "C5": "C5.mp3",
                "C6": "C6.mp3"
            },
            release: 1,
            baseUrl: "https://tonejs.github.io/audio/salamander/"
        }).toDestination();

        async function playNoteSound(vexNote) {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            if (piano.loaded) {
                const toneNote = vexNote.replace('/', '').toUpperCase();
                piano.triggerAttackRelease(toneNote, "8n");
            }
        }

        const VF = Vex.Flow;
        let currentHand = 'bass';
        let currentLevel = 1;
        let score = 0;

        let targetNotes = [];
        let currentInputIndex = 0;
        let hasMadeMistakeOnCurrentQuestion = false;

        const notesData = {
            treble: ['c/4','c#/4','d/4','d#/4','e/4','f/4','f#/4','g/4','g#/4','a/4','a#/4','b/4',
                     'c/5','c#/5','d/5','d#/5','e/5','f/5','f#/5','g/5','g#/5','a/5','a#/5','b/5',
                     'c/6','c#/6','d/6'],
            bass:   ['a/1','a#/1','b/1',
                     'c/2','c#/2','d/2','d#/2','e/2','f/2','f#/2','g/2','g#/2','a/2','a#/2','b/2',
                     'c/3','c#/3','d/3','d#/3','e/3','f/3','f#/3','g/3','a/3']
        };

        const keyboardToNoteMaps = {
            treble: {
                'a': 'c/4', 'w': 'c#/4', 's': 'd/4', 'e': 'd#/4',
                'f': 'f/4', 't': 'f#/4', 'g': 'g/4', 'y': 'g#/4', 'h': 'a/4', 'u': 'a#/4', 'j': 'b/4',
                'k': 'c/5'
            },
            bass: {
                'z': 'c/2', 's': 'c#/2', 'x': 'd/2', 'd': 'd#/2', 'c': 'e/2',
                'v': 'f/2', 'g': 'f#/2', 'b': 'g/2', 'h': 'g#/2', 'n': 'a/2', 'j': 'a#/2', 'm': 'b/2',
                ',': 'c/3'
            }
        };

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            let note = null;

            if (currentHand === 'treble' && keyboardToNoteMaps.treble[key]) {
                note = keyboardToNoteMaps.treble[key];
            } else if (currentHand === 'bass' && keyboardToNoteMaps.bass[key]) {
                note = keyboardToNoteMaps.bass[key];
            }

            if (note) {
                event.preventDefault(); 
                handleKeyPress(note);
            }
        });

        function clearAllKeyFeedback() {
            document.querySelectorAll('.key').forEach(key => {
                key.classList.remove('active', 'correct', 'incorrect', 'target-note');
            });
        }

        function buildPiano() {
            const container = document.getElementById('piano-container');
            container.innerHTML = '';
            const notes = notesData[currentHand];

            notes.forEach(note => {
                const key = document.createElement('div');
                const isBlack = note.includes('#');
                key.className = `key ${isBlack ? 'black' : 'white'}`;
                key.dataset.note = note;

                key.innerText = note.split('/')[0].toUpperCase();

                // 모바일 터치 및 마우스 클릭 대응 (스크롤을 방해하지 않도록 수정)
                const pressHandler = (e) => {
                    // e.preventDefault(); <-- 가로 스크롤을 위해 삭제
                    handleKeyPress(note);
                };
                
                // pointerdown 이벤트를 사용하여 터치와 마우스를 한 번에 처리합니다.
                key.addEventListener('pointerdown', pressHandler);
                
                container.appendChild(key);
            });
        }

        function getRandomNote(includeBlack = false) {
            const notes = notesData[currentHand];
            let pool = notes;
            if (!includeBlack) {
                pool = notes.filter(n => !n.includes('#'));
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function generateQuestion() {
            currentInputIndex = 0;
            targetNotes = [];
            hasMadeMistakeOnCurrentQuestion = false; 
            let vexNotes = [];

            clearAllKeyFeedback(); 
            clearMessage(); 

            if (currentLevel === 1) {
                const note = getRandomNote(false);
                targetNotes = [note];
                vexNotes = [createVexNote([note])];
            }
            else if (currentLevel === 2) {
                const note = getRandomNote(true);
                targetNotes = [note];
                vexNotes = [createVexNote([note])];
            }
            else if (currentLevel === 3) {
                targetNotes = [getRandomNote(true), getRandomNote(true), getRandomNote(true)];
                vexNotes = targetNotes.map(n => createVexNote([n]));
            }
            else if (currentLevel === 4) {
                const count = 2; 
                let chord = [];
                for(let i=0; i<count; i++) {
                    chord.push(getRandomNote(true)); 
                }
                chord.sort((a, b) => notesData[currentHand].indexOf(a) - notesData[currentHand].indexOf(b));
                chord = [...new Set(chord)];
                targetNotes = [...chord];
                vexNotes = [createVexNote(chord)];
            }
            else if (currentLevel === 5) {
                const count = 3; 
                let chord = [];
                for(let i=0; i<count; i++) {
                    chord.push(getRandomNote(true)); 
                }
                chord.sort((a, b) => notesData[currentHand].indexOf(a) - notesData[currentHand].indexOf(b));
                chord = [...new Set(chord)];
                targetNotes = [...chord];
                vexNotes = [createVexNote(chord)];
            }

            drawStaff(vexNotes);
        }

        function createVexNote(keys) {
            const staveNote = new VF.StaveNote({
                clef: currentHand,
                keys: keys,
                duration: "q"
            });

            keys.forEach((key, index) => {
                if (key.includes('#')) {
                    staveNote.addModifier(new VF.Accidental("#"), index);
                }
            });
            return staveNote;
        }

        function drawStaff(notes) {
            const container = document.getElementById('staff-container');
            container.innerHTML = '';

            const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
            const containerWidth = Math.min(window.innerWidth - 60, 400);
            renderer.resize(containerWidth, 140);
            const context = renderer.getContext();

            const stave = new VF.Stave(10, 10, containerWidth - 20);
            stave.addClef(currentHand).setContext(context).draw();

            const voice = new VF.Voice({num_beats: notes.length,  beat_value: 4});
            voice.addTickables(notes);

            new VF.Formatter().joinVoices([voice]).format([voice], containerWidth - 100);
            voice.draw(context, stave);
        }

        function showMessage(text, isError = false) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            msgDiv.style.color = isError ? '#ff3b30' : '#34c759';
        }

        function clearMessage() {
            document.getElementById('message').innerText = '';
        }

        function updateStats() {
            document.getElementById('level-display').innerText = currentLevel;
            document.getElementById('score-display').innerText = score;
        }

        function handleKeyPress(note) {
            playNoteSound(note);

            const inputKeyEl = document.querySelector(`[data-note="${note}"]`);
            if (inputKeyEl) {
                inputKeyEl.classList.add('active');
                setTimeout(() => inputKeyEl.classList.remove('active'), 100); 
            }

            const expectedNote = targetNotes[currentInputIndex];

            if (note === expectedNote) {
                currentInputIndex++;
                if (inputKeyEl) {
                    inputKeyEl.classList.remove('incorrect', 'target-note'); 
                    inputKeyEl.classList.add('correct');

                        setTimeout(() => inputKeyEl.classList.remove('correct'), 500); 
                    }
                }

말씀하신 문제는 화면 크기나 방향에 따라 UI를 맞출 때 정말 자주 겪는 레이아웃 이슈입니다. 건반(자식 요소)들의 전체 너비가 화면(부모 요소)보다 큰 상태인데 적절한 처리 속성이 없으면, 억지로 공간에 맞춰지면서 짤리거나 아예 스크롤이 막혀버리거든요.

이 두 가지 문제를 한 번에 해결할 수 있는 CSS 핵심 속성을 정리해 드릴게요.

### 1. 세로 모드에서 가로 스크롤 활성화하기
건반들을 감싸고 있는 **부모 컨테이너**에 가로 스크롤을 허용하는 속성을 추가해야 합니다.

*   **`overflow-x: auto;`**: 내용이 화면 너비를 넘칠 때 가로 스크롤을 생성합니다.
*   **`white-space: nowrap;`**: 건반들이 공간이 부족하다고 줄바꿈되어 밑으로 떨어지지 않도록 막아줍니다.

### 2. 건반 크기 잘림 (축소) 방지하기
Flexbox 등을 사용할 때 화면이 좁아지면 자식 요소들의 크기가 강제로 줄어들면서 짤리는 현상이 발생할 수 있습니다. 이를 막으려면 **건반 개별 요소**에 속성을 추가해야 합니다.

*   **`flex-shrink: 0;`**: 부모 공간이 좁아져도 건반이 쪼그라들지 않고 설정한 원래 크기를 유지하게 합니다.
*   **`box-sizing: border-box;`**: 테두리(border)나 패딩(padding) 때문에 예상했던 것보다 건반 크기가 더 커지는 것을 방지합니다.

---

**적용 예시 코드**

```css
/* 건반들을 감싸는 부모 박스 */
.keyboard-container {
    display: flex;
    overflow-x: auto;  /* 가로 스크롤 활성화 */
    width: 100%;       /* 화면에 꽉 차게 설정 */
    
    /* (선택) 스크롤바를 숨기고 싶을 때 */
    -ms-overflow-style: none; 
    scrollbar-width: none; 
}

.keyboard-container::-webkit-scrollbar {
    display: none; /* 크롬, 사파리 등에서 스크롤바 숨김 */
}

/* 개별 건반 요소 */
.key {
    flex-shrink: 0;         /* 좁은 화면에서도 건반 크기 유지 */
    width: 60px;            /* 설정하고자 하는 건반 너비 */
    box-sizing: border-box; /* 크기 계산 오류 방지 */
}
